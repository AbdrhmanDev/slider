<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        video {
            max-width: 100%;
            margin: 20px 0;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .video-container {
            width: 100%;
            max-width: 800px;
        }
    </style>
</head>
<body>
    <h1>Video Test Page</h1>
    <div class="video-container">
        <h2>Direct Video Element</h2>
        <video controls preload="auto" width="100%">
            <source src="../assets/videos/vid.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <h2>Video with Absolute Path</h2>
        <video id="absoluteVideo" controls preload="auto" width="100%">
            Your browser does not support the video tag.
        </video>
        
        <button id="playBtn">Play Video</button>
    </div>

    <script>
        // Set absolute path for the second video
        const absoluteVideo = document.getElementById('absoluteVideo');
        const absolutePath = window.location.origin + '/assets/videos/vid.mp4';
        absoluteVideo.src = absolutePath;
        
        // Add play button functionality
        document.getElementById('playBtn').addEventListener('click', function() {
            absoluteVideo.play();
        });
        
        // Log video loading events
        absoluteVideo.addEventListener('loadstart', () => console.log('Video load started'));
        absoluteVideo.addEventListener('loadeddata', () => console.log('Video data loaded'));
        absoluteVideo.addEventListener('error', (e) => console.error('Video error:', e));
    </script>
</body>
</html>
